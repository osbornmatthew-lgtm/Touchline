name: Update from Full-Time

on:
  # Schedule switched off: Full-Time refuses requests from GitHub's servers (403).
  # Run by hand from the Actions tab, or from a machine on a home connection.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "touchline-bot"
          git config user.email "touchline-bot@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update from Full-Time $(date -u +%Y-%m-%d)"
            git push
          fi
