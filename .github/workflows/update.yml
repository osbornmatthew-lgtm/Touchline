name: Update from Full-Time

on:
  schedule:
    # GitHub runs these in UTC. During UK summer time they land an hour later on the clock.
    - cron: '49 7 * * 6'   # Saturday morning: midweek results
    - cron: '51 16 * * 0'  # Sunday evening: weekend results
    - cron: '51 19 * * 1'  # Monday evening: late entries
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "touchline-bot"
          git config user.email "touchline-bot@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update from Full-Time $(date -u +%Y-%m-%d)"
            git push
          fi
