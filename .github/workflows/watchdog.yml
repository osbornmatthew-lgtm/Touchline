name: Watchdog (Sunday updates)

# Every 15 minutes on Sundays. GitHub runs these in UTC and can start them a few minutes late;
# the script itself works in UK time and only checks 10:45 to 21:00. A failed run here emails the
# repo owner (GitHub > Settings > Notifications > Actions: failed workflows). Optional phone push:
# add a repository secret NTFY_TOPIC with your ntfy.sh topic name.
on:
  schedule:
    - cron: '7,22,37,52 9-21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest status from the home runner
        run: git fetch --depth 1 origin status && git show origin/status:status.json > status.json || echo "no status branch yet"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the last good update
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python runner/watchdog.py status.json
